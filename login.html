<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — TargetBand9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="dot"></span>TargetBand9</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="pricing.html">Pricing</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-cta" id="nav-auth-slot">
      <a href="login.html" class="btn btn-outline btn-sm">Log in</a>
      <a href="signup.html" class="btn btn-coral btn-sm">Sign up</a>
    </div>
    <button class="nav-toggle" aria-label="Menu">☰</button>
  </div>
</nav>

<section style="padding: 70px 0;">
  <div class="container">
    <div class="form-panel">
      <h2>Welcome back</h2>
      <p class="sub">Log in to access your premium practice tests.</p>

      <div class="form-msg error" id="form-msg"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-coral btn-block">Log in</button>
      </form>

      <div class="form-switch">Don't have an account? <a href="signup.html">Sign up</a></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none; padding-top:0;">
      <span>© 2026 TargetBand9. All rights reserved.</span>
      <span><a href="contact.html" style="color:var(--muted);">Contact</a></span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const msg = document.getElementById('form-msg');

  const { error } = await signIn(email, password);
  if (error) {
    msg.textContent = error.message;
    msg.classList.add('show');
    return;
  }
  window.location.href = "dashboard.html";
});
</script>
</body>
</html>
